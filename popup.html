<!DOCTYPE html>
<html>
<head>
  <title>AI Prompt Modifier</title>
  <link rel="stylesheet" type="text/css" href="popup.css">
</head>
<body>
  <h3>AI Prompt Modifier</h3>
  <textarea id="textToModify" rows="5" placeholder="Enter text to modify or it will use selected text on page..."></textarea>
  
  <div>
    <label for="modificationType">Modification Style:</label>
    <select id="modificationType">
      <option value="improve">Improve Text</option>
      <option value="summarize">Summarize Text</option>
      <option value="bulletPoints">Convert to Bullet Points</option>
      <option value="simplify">Simplify Text</option>
      <option value="elaborate">Elaborate on Text</option>
      <option value="correctGrammar">Correct Grammar</option>
      <option value="changeToneProfessional">Change Tone to Professional</option>
      <option value="changeToneCasual">Change Tone to Casual</option>
      <option value="translateToSpanish">Translate to Spanish</option>
      <option value="translateToFrench">Translate to French</option>
      <option value="concise">Make Text Concise</option>
      <option value="expand">Expand on Text</option>
      <option value="default">Other (Default Refinement)</option>
    </select>
  </div>
  
  <button id="modifyButton">Modify Text</button>
  
  <hr>
  
  <h4>Modified Text:</h4>
  <textarea id="modifiedTextResult" rows="5" readonly placeholder="AI-modified text will appear here..."></textarea>
  
  <p id="statusMessage"></p>
  
  <a href="options.html" target="_blank">Settings (API Key)</a>
  
  <script src="popup.js"></script>
</body>
</html>
